[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lit-review-agent"
version = "0.1.0"
description = "LangGraph agent that retrieves, clusters and synthesizes academic papers into cited literature reviews with gap analysis."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "lit-review-agent" }]
keywords = ["langgraph", "langchain", "literature-review", "arxiv", "openalex", "agent"]

dependencies = [
    "langgraph>=0.2.0",
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.2.0",
    "requests>=2.31.0",
    "pypdf>=4.0.0",
    "scikit-learn>=1.3.0",
    "numpy>=1.24.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
# 语义 embedding（不装则自动退化为 TF-IDF + SVD）
embed = ["sentence-transformers>=3.0.0"]
# SQLite 检查点持久化
persist = ["langgraph-checkpoint-sqlite>=2.0.0"]
# FastAPI HTTP 入口
api = ["fastapi>=0.110.0", "uvicorn[standard]>=0.29.0", "pydantic>=2.6.0"]
# Word (.docx) 成稿输出
docx = ["python-docx>=1.1.0"]
dev = ["pytest>=8.0.0", "pytest-cov>=5.0.0"]
# 开箱即用：聚类 + 断点续跑 + 测试
all = ["sentence-transformers>=3.0.0", "langgraph-checkpoint-sqlite>=2.0.0", "pytest>=8.0.0", "pytest-cov>=5.0.0", "fastapi>=0.110.0", "uvicorn[standard]>=0.29.0", "pydantic>=2.6.0"]

[project.scripts]
lit-review = "src.main:main"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not network'"
markers = [
    "network: 需要访问外部学术 API 的测试（默认跳过，用 -m network 运行）",
]
